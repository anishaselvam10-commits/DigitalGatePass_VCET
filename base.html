<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Gate Pass{% endblock %} · {{ college }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div><strong>{{ college }}</strong><small>{{ place }} · Digital Gate Pass</small></div>
  {% if user %}
  <div class="who">
    <span>{{ user.name }} ({{ user.reg }}) · {{ user.role|upper }}</span>
    <form method="post" action="{{ url_for('logout') }}">{{ csrf() }}<button class="link">Logout</button></form>
  </div>
  {% endif %}
</header>
<main>
  {% for category, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ msg }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
